name: devenv templates

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  evaluate:
    name: ${{ matrix.template }} (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - template: bun-ts
            runner: ubuntu-24.04
            platform: x86_64-linux
          - template: rust
            runner: ubuntu-24.04
            platform: x86_64-linux
          - template: bare
            runner: ubuntu-24.04
            platform: x86_64-linux
          - template: deno
            runner: ubuntu-24.04
            platform: x86_64-linux
          - template: bun-ts
            runner: macos-14
            platform: aarch64-darwin
          - template: rust
            runner: macos-14
            platform: aarch64-darwin
          - template: bare
            runner: macos-14
            platform: aarch64-darwin
          - template: deno
            runner: macos-14
            platform: aarch64-darwin

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: devenv
      - name: Install devenv
        run: nix profile add nixpkgs#devenv
      - name: Check runner architecture
        run: |
          case "${{ matrix.platform }}" in
            x86_64-linux) test "$(uname -s)" = Linux && test "$(uname -m)" = x86_64 ;;
            aarch64-darwin) test "$(uname -s)" = Darwin && test "$(uname -m)" = arm64 ;;
            *) exit 1 ;;
          esac
      - name: Use the checkout's module input
        working-directory: templates/${{ matrix.template }}
        run: |
          cat > devenv.local.yaml <<'EOF'
          inputs:
            agents:
              url: path:../..
          EOF
      - name: Evaluate template and assert module invariants
        working-directory: templates/${{ matrix.template }}
        run: devenv test
